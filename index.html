<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: transparent; color: white; font-family: sans-serif; overflow: hidden; margin: 0; padding: 10px; }
        #widget { display: flex; align-items: center; background: rgba(0,0,0,0.85); border-left: 6px solid #53fc18; padding: 12px; border-radius: 10px; width: fit-content; }
        #cover { width: 65px; height: 65px; border-radius: 6px; margin-right: 15px; background: #222; }
        #info { max-width: 250px; }
        #title { font-weight: bold; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #artist { font-size: 14px; color: #bdc3c7; }
    </style>
</head>
<body>
    <div id="widget">
        <img id="cover" src="" alt="">
        <div id="info">
            <div id="title">Waiting for Music...</div>
            <div id="artist">Start YouTube Music App</div>
        </div>
    </div>
    <script>
        async function update() {
            try {
                // We use 'localhost' because your browser test worked with it
                const r = await fetch('http://localhost:9863/api/v1/song');
                const d = await r.json();
                if (d && d.title) {
                    document.getElementById('title').innerText = d.title;
                    document.getElementById('artist').innerText = d.artist;
                    // Fixed: Using 'imageSrc' instead of 'albumArt' to match your data
                    document.getElementById('cover').src = d.imageSrc;
                }
            } catch (e) {
                console.log("Searching for app...");
            }
        }
        setInterval(update, 2000);
        update();
    </script>
</body>
</html>
