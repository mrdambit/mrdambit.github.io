<!DOCTYPE html>
<html>
<head>
    <style>
        /* This part makes the widget look good for your stream */
        body { background: transparent; color: white; font-family: sans-serif; overflow: hidden; }
        #widget { display: flex; align-items: center; background: rgba(0,0,0,0.8); border-left: 5px solid #53fc18; padding: 10px; border-radius: 8px; width: fit-content; }
        #cover { width: 60px; height: 60px; border-radius: 4px; margin-right: 12px; }
        #info { max-width: 200px; }
        #title { font-weight: bold; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #artist { font-size: 14px; color: #aaa; }
    </style>
</head>
<body>
    <div id="widget">
        <img id="cover" src="" alt="">
        <div id="info">
            <div id="title">Waiting...</div>
            <div id="artist">Start YouTube Music</div>
        </div>
    </div>
    <script>
        /* This part connects the widget to your YouTube Music App on Nobara */
        async function update() {
            try {
                // It looks for the app on your PC at port 9863
                const r = await fetch('http://localhost:9863/api/v1/song');
                const d = await r.json();
                if (d) {
                    document.getElementById('title').innerText = d.title;
                    document.getElementById('artist').innerText = d.artist;
                    document.getElementById('cover').src = d.albumArt;
                }
            } catch (e) {
                // If the app is closed, it just stays quiet
            }
        }
        // It checks for a new song every 2 seconds
        setInterval(update, 2000);
    </script>
</body>
</html>
