<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
            background: transparent;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow: hidden;
        }
        #widget {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            border-left: 5px solid #53fc18; /* Kick Green */
            padding: 10px;
            border-radius: 8px;
            width: fit-content;
        }
        #cover {
            width: 50px;
            height: 50px;
            border-radius: 4px;
            margin-right: 12px;
        }
        #info {
            max-width: 250px;
        }
        #title {
            font-weight: bold;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #artist {
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div id="widget">
        <img id="cover" src="https://via.placeholder.com/50" alt="Cover">
        <div id="info">
            <div id="title">Not Playing</div>
            <div id="artist">YouTube Music</div>
        </div>
    </div>

    <script>
        async function updateMusic() {
            try {
                const response = await fetch('http://localhost:9863/api/v1/song');
                const data = await response.json();
                
                if (data) {
                    document.getElementById('title').innerText = data.title;
                    document.getElementById('artist').innerText = data.artist;
                    document.getElementById('cover').src = data.albumArt;
                }
            } catch (err) {
                console.log("Waiting for music app...");
            }
        }
        setInterval(updateMusic, 2000); // Checks for new song every 2 seconds
    </script>
</body>
</html>
