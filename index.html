<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dambit Music Overlay</title>
    <style>
        /* Transparent background for OBS */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: transparent;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Branded for your Kick stream */
        #widget {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            border-left: 6px solid #53fc18; /* Kick Green */
            padding: 12px;
            border-radius: 10px;
            width: fit-content;
            max-width: 400px;
        }

        #cover {
            width: 65px;
            height: 65px;
            border-radius: 6px;
            margin-right: 15px;
            object-fit: cover;
            background-color: #222;
        }

        #info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }

        #title {
            font-weight: bold;
            font-size: 18px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        #artist {
            font-size: 14px;
            color: #bdc3c7;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <div id="widget">
        <img id="cover" src="https://via.placeholder.com/65?text=..." alt="Cover Art">
        <div id="info">
            <div id="title">Waiting for Music...</div>
            <div id="artist">Start YouTube Music App</div>
        </div>
    </div>

    <script>
        async function updateMusic() {
            try {
                /* Connect to your local app on port 9863 */
                const response = await fetch('http://localhost:9863/api/v1/song');
                
                /* If the app says "Unauthorized", tell the user */
                if (response.status === 401) {
                    document.getElementById('title').innerText = "Authorize App";
                    document.getElementById('artist').innerText = "Check Music App window";
                    return;
                }

                const data = await response.json();
                
                if (data && data.title) {
                    document.getElementById('title').innerText = data.title;
                    document.getElementById('artist').innerText = data.artist;
                    document.getElementById('cover').src = data.albumArt;
                }
            } catch (err) {
                /* Stays on "Waiting" if app is closed or connection is lost */
                console.log("Searching for local connection...");
            }
        }

        /* Check for new song info every 2 seconds */
        setInterval(updateMusic, 2000);
        
        /* Run once immediately on load */
        updateMusic();
    </script>
</body>
</html>
